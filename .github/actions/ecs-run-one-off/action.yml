name: 'ECS Run One-Off Task'
description: 'Configure AWS, run a Fargate one-off task, wait for it to stop, and check the container exit code.'

inputs:
  role_arn:
    description: 'IAM role ARN to assume'
    required: true
  aws_region:
    description: 'AWS region'
    required: false
    default: 'eu-west-2'
  cluster:
    description: 'ECS cluster name'
    required: true
  task_definition:
    description: 'ECS task definition family'
    required: true
  subnets:
    description: 'Comma-separated public subnet IDs'
    required: true
  security_group:
    description: 'ECS security group ID'
    required: true
  container_overrides:
    description: 'JSON overrides object (containerOverrides)'
    required: true
  step_label:
    description: 'Human label used in log messages (e.g. Migration, Seeder)'
    required: false
    default: 'Task'

runs:
  using: 'composite'
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role_arn }}
        aws-region: ${{ inputs.aws_region }}

    - name: Run Fargate task
      id: run-task
      shell: bash
      run: |
        NET="awsvpcConfiguration={subnets=[${{ inputs.subnets }}],securityGroups=[${{ inputs.security_group }}],assignPublicIp=ENABLED}"
        TASK_ARN=$(aws ecs run-task \
          --cluster "${{ inputs.cluster }}" \
          --task-definition "${{ inputs.task_definition }}" \
          --launch-type FARGATE \
          --network-configuration "$NET" \
          --overrides '${{ inputs.container_overrides }}' \
          --query 'tasks[0].taskArn' \
          --output text)
        echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"

    - name: Wait for task to stop
      shell: bash
      run: |
        aws ecs wait tasks-stopped \
          --cluster "${{ inputs.cluster }}" \
          --tasks "${{ steps.run-task.outputs.task_arn }}"

    - name: Check exit code
      shell: bash
      run: |
        EXIT_CODE=$(aws ecs describe-tasks \
          --cluster "${{ inputs.cluster }}" \
          --tasks "${{ steps.run-task.outputs.task_arn }}" \
          --query 'tasks[0].containers[0].exitCode' \
          --output text)
        echo "${{ inputs.step_label }} container exit code: $EXIT_CODE"
        if [ "$EXIT_CODE" != "0" ]; then
          echo "${{ inputs.step_label }} failed with exit code $EXIT_CODE"
          exit 1
        fi
