name: 'ECR Build + ECS Service Deploy'
description: 'Build and push a Docker image to ECR, register a new ECS task definition revision, and update the service.'

inputs:
  role_arn:
    description: 'IAM role ARN to assume'
    required: true
  aws_region:
    description: 'AWS region'
    required: false
    default: 'eu-west-2'
  image_tag:
    description: 'Full image URI including tag (e.g. <ecr-registry>:<git-sha>)'
    required: true
  context:
    description: 'Docker build context'
    required: false
    default: '.'
  dockerfile:
    description: 'Path to Dockerfile'
    required: false
    default: 'Dockerfile'
  ecs_cluster:
    description: 'ECS cluster name'
    required: true
  ecs_service:
    description: 'ECS service name'
    required: true
  ecs_task_family:
    description: 'ECS task definition family'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role_arn }}
        aws-region: ${{ inputs.aws_region }}

    - name: Login to ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: true
        tags: ${{ inputs.image_tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Register new task definition revision
      id: register-td
      shell: bash
      run: |
        NEW_TD=$(aws ecs describe-task-definition \
          --task-definition "${{ inputs.ecs_task_family }}" \
          --query taskDefinition \
          --output json \
          | jq --arg IMAGE "${{ inputs.image_tag }}" \
            'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy) |
             .containerDefinitions[0].image = $IMAGE')
        echo "$NEW_TD" > /tmp/new-td.json
        NEW_TD_ARN=$(aws ecs register-task-definition \
          --cli-input-json file:///tmp/new-td.json \
          --query taskDefinition.taskDefinitionArn \
          --output text)
        echo "arn=$NEW_TD_ARN" >> "$GITHUB_OUTPUT"

    - name: Update ECS service
      shell: bash
      run: |
        aws ecs update-service \
          --cluster "${{ inputs.ecs_cluster }}" \
          --service "${{ inputs.ecs_service }}" \
          --task-definition "${{ steps.register-td.outputs.arn }}"

    - name: Wait for service stability
      shell: bash
      run: |
        aws ecs wait services-stable \
          --cluster "${{ inputs.ecs_cluster }}" \
          --services "${{ inputs.ecs_service }}"
