name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "terraform/environmental/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"
      - ".github/actions/configure-aws-env/**"
  pull_request:
    paths:
      - "terraform/**"
      - "frontend/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - sandbox
          - staging
          - uat
          - production
        default: "sandbox"
  workflow_call:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: string
      auto_apply:
        description: "Auto-apply after plan (used by caller workflows)"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-${{ inputs.environment || 'sandbox' }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2

jobs:
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'
              - '.github/workflows/deploy.yml'
              - '.github/actions/configure-aws-env/**'
            frontend:
              - 'frontend/**'

  terraform-plan:
    name: Terraform Plan
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    environment:
      name: ${{ inputs.environment || 'sandbox' }}

    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Set environment
        id: set-env
        run: |
          if [ -n "${{ inputs.environment }}" ]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=sandbox" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS & Terraform
        uses: ./.github/actions/configure-aws-env
        with:
          environment: ${{ steps.set-env.outputs.environment }}
          aws_region: ${{ env.AWS_REGION }}
          role_arn: ${{ secrets.AWS_ROLE_ARN }}
          setup_terraform: "true"

      - name: Terraform Init
        env:
          ACCOUNT: ${{ steps.set-env.outputs.environment }}
        run: make environmental-init ACCOUNT=${{ env.ACCOUNT }} AWS_PROFILE=""

      - name: Terraform Validate
        run: make environmental-validate AWS_PROFILE=""

      - name: Terraform Plan
        id: plan
        env:
          ACCOUNT: ${{ steps.set-env.outputs.environment }}
        run: |
          set +e
          make environmental-plan ACCOUNT=${{ env.ACCOUNT }} AWS_PROFILE="" TF_FLAGS="-no-color" 2>&1 | tee plan-output.txt
          exitcode=${PIPESTATUS[0]}
          echo "exitcode=$exitcode" >> $GITHUB_OUTPUT
          exit $exitcode

      - name: Comment PR with plan output
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('plan-output.txt', 'utf8');
            const plan = raw.length > 60000
              ? raw.substring(0, 60000) + '\n\n...(output truncated)'
              : raw;
            const env = '${{ steps.set-env.outputs.environment }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan — \`${env}\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`
            });

  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    if: |
      github.ref == 'refs/heads/main' &&
      needs.terraform-plan.outputs.exitcode == '0' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && needs.terraform-plan.outputs.environment == 'sandbox') ||
        (inputs.auto_apply && needs.terraform-plan.outputs.environment == 'sandbox')
      )
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: ${{ needs.terraform-plan.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS & Terraform
        uses: ./.github/actions/configure-aws-env
        with:
          environment: ${{ needs.terraform-plan.outputs.environment }}
          aws_region: ${{ env.AWS_REGION }}
          role_arn: ${{ secrets.AWS_ROLE_ARN }}
          setup_terraform: "true"

      - name: Terraform Init
        env:
          ACCOUNT: ${{ needs.terraform-plan.outputs.environment }}
        run: make environmental-init ACCOUNT=${{ env.ACCOUNT }} AWS_PROFILE=""

      - name: Terraform Apply
        env:
          ACCOUNT: ${{ needs.terraform-plan.outputs.environment }}
        run: make environmental-apply ACCOUNT=${{ env.ACCOUNT }} AWS_PROFILE="" TF_FLAGS="-auto-approve -no-color"

  frontend-deploy:
    name: Frontend Deploy
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: sandbox

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          package_json_file: frontend/package.json

      - name: Resolve pnpm store path
        id: pnpm-store
        working-directory: frontend
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: pnpm build

      - name: Sync hashed assets to S3 (immutable, 1-year cache)
        run: |
          aws s3 sync frontend/dist/assets/ s3://${{ vars.S3_BUCKET }}/assets/ \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync root files to S3 (no-cache, delete stale)
        run: |
          aws s3 sync frontend/dist/ s3://${{ vars.S3_BUCKET }}/ \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html" "/"
