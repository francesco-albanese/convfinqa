name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "terraform/environmental/**"
      - ".github/workflows/deploy.yml"
      - ".github/actions/configure-aws-env/**"
  pull_request:
    paths:
      - "terraform/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - sandbox
          - staging
          - uat
          - production
        default: "sandbox"
  workflow_call:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: string
      auto_apply:
        description: "Auto-apply after plan (used by caller workflows)"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-${{ inputs.environment || 'sandbox' }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    environment:
      name: ${{ inputs.environment || 'sandbox' }}

    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Set environment
        id: set-env
        run: |
          if [ -n "${{ inputs.environment }}" ]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=sandbox" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS & Terraform
        uses: ./.github/actions/configure-aws-env
        with:
          environment: ${{ steps.set-env.outputs.environment }}
          aws_region: ${{ env.AWS_REGION }}
          role_arn: ${{ secrets.AWS_ROLE_ARN }}
          setup_terraform: "true"

      - name: Terraform Init
        env:
          ACCOUNT: ${{ steps.set-env.outputs.environment }}
        run: make environmental-init ACCOUNT=${{ env.ACCOUNT }} AWS_PROFILE=""

      - name: Terraform Validate
        run: make environmental-validate AWS_PROFILE=""

      - name: Terraform Plan
        id: plan
        env:
          ACCOUNT: ${{ steps.set-env.outputs.environment }}
        run: |
          set +e
          make environmental-plan ACCOUNT=${{ env.ACCOUNT }} AWS_PROFILE="" TF_FLAGS="-no-color" 2>&1 | tee plan-output.txt
          exitcode=${PIPESTATUS[0]}
          echo "exitcode=$exitcode" >> $GITHUB_OUTPUT
          exit $exitcode

      - name: Comment PR with plan output
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('plan-output.txt', 'utf8');
            const plan = raw.length > 60000
              ? raw.substring(0, 60000) + '\n\n...(output truncated)'
              : raw;
            const env = '${{ steps.set-env.outputs.environment }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan — \`${env}\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`
            });

  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    if: |
      github.ref == 'refs/heads/main' &&
      needs.terraform-plan.outputs.exitcode == '0' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && needs.terraform-plan.outputs.environment == 'sandbox') ||
        (inputs.auto_apply && needs.terraform-plan.outputs.environment == 'sandbox')
      )
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: ${{ needs.terraform-plan.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS & Terraform
        uses: ./.github/actions/configure-aws-env
        with:
          environment: ${{ needs.terraform-plan.outputs.environment }}
          aws_region: ${{ env.AWS_REGION }}
          role_arn: ${{ secrets.AWS_ROLE_ARN }}
          setup_terraform: "true"

      - name: Terraform Init
        env:
          ACCOUNT: ${{ needs.terraform-plan.outputs.environment }}
        run: make environmental-init ACCOUNT=${{ env.ACCOUNT }} AWS_PROFILE=""

      - name: Terraform Apply
        env:
          ACCOUNT: ${{ needs.terraform-plan.outputs.environment }}
        run: make environmental-apply ACCOUNT=${{ env.ACCOUNT }} AWS_PROFILE="" TF_FLAGS="-auto-approve -no-color"
