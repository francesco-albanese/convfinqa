name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "terraform/environmental/**"
      - "frontend/**"
      - "backend/**"
      - "auth-lambda/**"
      - ".github/workflows/deploy.yml"
      - ".github/actions/configure-aws-env/**"
  pull_request:
    paths:
      - "terraform/**"
      - "frontend/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - sandbox
          - staging
          - uat
          - production
        default: "sandbox"
      confirm:
        description: "Type DESTROY to run the compute-destroy job"
        required: false
        type: string
        default: ""
      run_seed:
        description: "Seed documents from ConvFinQA dataset (idempotent)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: string
      auto_apply:
        description: "Auto-apply after plan (used by caller workflows)"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-${{ inputs.environment || 'sandbox' }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2

jobs:
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      backend_deploy: ${{ steps.filter.outputs.backend_deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'
              - '.github/workflows/deploy.yml'
              - '.github/actions/configure-aws-env/**'
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/alembic/**'
              - 'backend/src/convfinqa/adapters/persistence/**'
            backend_deploy:
              - 'backend/**'

  terraform-plan:
    name: Terraform Plan
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    environment:
      name: ${{ inputs.environment || 'sandbox' }}

    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Set environment
        id: set-env
        run: |
          if [ -n "${{ inputs.environment }}" ]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=sandbox" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS & Terraform
        uses: ./.github/actions/configure-aws-env
        with:
          environment: ${{ steps.set-env.outputs.environment }}
          aws_region: ${{ env.AWS_REGION }}
          role_arn: ${{ secrets.AWS_ROLE_ARN }}
          setup_terraform: "true"

      - name: Build lambdas
        uses: ./.github/actions/build-lambdas

      - name: Terraform Init
        env:
          ACCOUNT: ${{ steps.set-env.outputs.environment }}
        run: make environmental-init ACCOUNT=${{ env.ACCOUNT }} AWS_PROFILE=""

      - name: Terraform Validate
        run: make environmental-validate AWS_PROFILE=""

      - name: Terraform Plan
        id: plan
        env:
          ACCOUNT: ${{ steps.set-env.outputs.environment }}
        run: |
          set +e
          make environmental-plan ACCOUNT=${{ env.ACCOUNT }} AWS_PROFILE="" TF_FLAGS="-no-color" 2>&1 | tee plan-output.txt
          exitcode=${PIPESTATUS[0]}
          echo "exitcode=$exitcode" >> $GITHUB_OUTPUT
          exit $exitcode

      - name: Comment PR with plan output
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('plan-output.txt', 'utf8');
            const plan = raw.length > 60000
              ? raw.substring(0, 60000) + '\n\n...(output truncated)'
              : raw;
            const env = '${{ steps.set-env.outputs.environment }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan — \`${env}\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`
            });

  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    if: |
      github.ref == 'refs/heads/main' &&
      needs.terraform-plan.outputs.exitcode == '0' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && needs.terraform-plan.outputs.environment == 'sandbox') ||
        (inputs.auto_apply && needs.terraform-plan.outputs.environment == 'sandbox')
      )
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: ${{ needs.terraform-plan.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS & Terraform
        uses: ./.github/actions/configure-aws-env
        with:
          environment: ${{ needs.terraform-plan.outputs.environment }}
          aws_region: ${{ env.AWS_REGION }}
          role_arn: ${{ secrets.AWS_ROLE_ARN }}
          setup_terraform: "true"

      - name: Build lambdas
        uses: ./.github/actions/build-lambdas

      - name: Terraform Init
        env:
          ACCOUNT: ${{ needs.terraform-plan.outputs.environment }}
        run: make environmental-init ACCOUNT=${{ env.ACCOUNT }} AWS_PROFILE=""

      - name: Terraform Apply
        env:
          ACCOUNT: ${{ needs.terraform-plan.outputs.environment }}
        run: make environmental-apply ACCOUNT=${{ env.ACCOUNT }} AWS_PROFILE="" TF_FLAGS="-auto-approve -no-color"

  migrations:
    name: Run Alembic Migrations
    needs: [detect-changes, terraform-apply]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.detect-changes.outputs.backend == 'true' &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped')
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: sandbox

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run migrations Fargate task
        id: run-task
        run: |
          NET="awsvpcConfiguration={subnets=[${{ vars.PUBLIC_SUBNET_IDS }}],securityGroups=[${{ vars.ECS_SG_ID }}],assignPublicIp=ENABLED}"
          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --task-definition "${{ vars.ECS_TASK_FAMILY }}" \
            --launch-type FARGATE \
            --network-configuration "$NET" \
            --overrides '{"containerOverrides":[{"name":"api","command":["uv","run","alembic","upgrade","head"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)
          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"

      - name: Wait for task to stop
        run: |
          aws ecs wait tasks-stopped \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --tasks "${{ steps.run-task.outputs.task_arn }}"

      - name: Check exit code
        run: |
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --tasks "${{ steps.run-task.outputs.task_arn }}" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)
          echo "Migration container exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migrations failed with exit code $EXIT_CODE"
            exit 1
          fi

  backend-deploy:
    name: Backend Deploy
    needs: [detect-changes, migrations]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.detect-changes.outputs.backend_deploy == 'true' &&
      (needs.migrations.result == 'success' || needs.migrations.result == 'skipped')
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: sandbox

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ vars.ECR_REGISTRY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --force-new-deployment

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}"

  frontend-deploy:
    name: Frontend Deploy
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: sandbox

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          package_json_file: frontend/package.json

      - name: Resolve pnpm store path
        id: pnpm-store
        working-directory: frontend
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: pnpm build

      - name: Sync hashed assets to S3 (immutable, 1-year cache)
        run: |
          aws s3 sync frontend/dist/assets/ s3://${{ vars.S3_BUCKET }}/assets/ \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync root files to S3 (no-cache, delete stale)
        run: |
          aws s3 sync frontend/dist/ s3://${{ vars.S3_BUCKET }}/ \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html" "/"

  compute-destroy:
    name: Compute Destroy
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'DESTROY'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: ${{ inputs.environment || 'sandbox' }}

    steps:
      - name: Verify confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "DESTROY" ]; then
            echo "confirm input must be exactly 'DESTROY' to proceed"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS & Terraform
        uses: ./.github/actions/configure-aws-env
        with:
          environment: ${{ inputs.environment || 'sandbox' }}
          aws_region: ${{ env.AWS_REGION }}
          role_arn: ${{ secrets.AWS_ROLE_ARN }}
          setup_terraform: "true"

      - name: Build lambdas
        uses: ./.github/actions/build-lambdas

      - name: Terraform Init
        env:
          ACCOUNT: ${{ inputs.environment || 'sandbox' }}
        run: make environmental-init ACCOUNT=${{ env.ACCOUNT }} AWS_PROFILE=""

      - name: Terraform Destroy compute + keepalive
        env:
          ACCOUNT: ${{ inputs.environment || 'sandbox' }}
        run: |
          make environmental-destroy ACCOUNT=${{ env.ACCOUNT }} AWS_PROFILE="" \
            TF_FLAGS="-target=module.compute -target=module.keepalive -auto-approve -no-color"

  documents-seed:
    name: Seed Documents
    if: github.event_name == 'workflow_dispatch' && inputs.run_seed == true
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: ${{ inputs.environment || 'sandbox' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run seeder Fargate task
        id: run-task
        run: |
          NET="awsvpcConfiguration={subnets=[${{ vars.PUBLIC_SUBNET_IDS }}],securityGroups=[${{ vars.ECS_SG_ID }}],assignPublicIp=ENABLED}"
          OVERRIDES='{"containerOverrides":[{"name":"api","command":["python","-m","convfinqa.adapters.persistence.documents_seeder"]}]}'
          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --task-definition "${{ vars.ECS_TASK_FAMILY }}" \
            --launch-type FARGATE \
            --network-configuration "$NET" \
            --overrides "$OVERRIDES" \
            --query 'tasks[0].taskArn' \
            --output text)
          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"

      - name: Wait for task to stop
        run: |
          aws ecs wait tasks-stopped \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --tasks "${{ steps.run-task.outputs.task_arn }}"

      - name: Check exit code
        run: |
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --tasks "${{ steps.run-task.outputs.task_arn }}" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)
          echo "Seeder container exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Seeder failed with exit code $EXIT_CODE"
            exit 1
          fi
