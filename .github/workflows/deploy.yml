name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "terraform/environmental/**"
      - "frontend/**"
      - "backend/**"
      - "auth-lambda/**"
      - ".github/workflows/deploy.yml"
      - ".github/actions/**"
  pull_request:
    paths:
      - "terraform/**"
      - "frontend/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - sandbox
          - staging
          - uat
          - production
        default: "sandbox"
      confirm:
        description: "Type DESTROY to run the compute-destroy job"
        required: false
        type: string
        default: ""
      run_seed:
        description: "Seed documents from ConvFinQA dataset (idempotent)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: string
      auto_apply:
        description: "Auto-apply after plan (used by caller workflows)"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-${{ inputs.environment || 'sandbox' }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2

jobs:
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      backend_deploy: ${{ steps.filter.outputs.backend_deploy }}
      auth_lambda: ${{ steps.filter.outputs.auth_lambda }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'
              - '.github/workflows/deploy.yml'
              - '.github/actions/**'
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/alembic/**'
              - 'backend/src/convfinqa/adapters/persistence/**'
            backend_deploy:
              - 'backend/**'
            auth_lambda:
              - 'auth-lambda/**'

  terraform-plan:
    name: Terraform Plan
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    environment:
      name: ${{ inputs.environment || 'sandbox' }}

    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Set environment
        id: set-env
        run: |
          if [ -n "${{ inputs.environment }}" ]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=sandbox" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Terraform Setup
        uses: ./.github/actions/tf-setup
        with:
          environment: ${{ steps.set-env.outputs.environment }}
          aws_region: ${{ env.AWS_REGION }}
          role_arn: ${{ secrets.AWS_ROLE_ARN }}

      - name: Terraform Validate
        run: make environmental-validate AWS_PROFILE=""

      - name: Terraform Plan
        id: plan
        env:
          ACCOUNT: ${{ steps.set-env.outputs.environment }}
        run: |
          set +e
          make environmental-plan ACCOUNT=${{ env.ACCOUNT }} AWS_PROFILE="" TF_FLAGS="-no-color" 2>&1 | tee plan-output.txt
          exitcode=${PIPESTATUS[0]}
          echo "exitcode=$exitcode" >> $GITHUB_OUTPUT
          exit $exitcode

      - name: Comment PR with plan output
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('plan-output.txt', 'utf8');
            const plan = raw.length > 60000
              ? raw.substring(0, 60000) + '\n\n...(output truncated)'
              : raw;
            const env = '${{ steps.set-env.outputs.environment }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan — \`${env}\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`
            });

  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    if: |
      github.ref == 'refs/heads/main' &&
      needs.terraform-plan.outputs.exitcode == '0' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && needs.terraform-plan.outputs.environment == 'sandbox') ||
        (inputs.auto_apply && needs.terraform-plan.outputs.environment == 'sandbox')
      )
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: ${{ needs.terraform-plan.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Terraform Setup
        uses: ./.github/actions/tf-setup
        with:
          environment: ${{ needs.terraform-plan.outputs.environment }}
          aws_region: ${{ env.AWS_REGION }}
          role_arn: ${{ secrets.AWS_ROLE_ARN }}

      - name: Terraform Apply
        env:
          ACCOUNT: ${{ needs.terraform-plan.outputs.environment }}
        run: make environmental-apply ACCOUNT=${{ env.ACCOUNT }} AWS_PROFILE="" TF_FLAGS="-auto-approve -no-color"

      - name: Populate GitHub environment variables
        env:
          GH_TOKEN: ${{ secrets.GH_VARS_PAT }}
          ENV: ${{ needs.terraform-plan.outputs.environment }}
        run: |
          gh variable set ECR_REGISTRY               --env "$ENV" --body "$(terraform -chdir=terraform/environmental output -raw ecr_registry)"
          gh variable set ECS_CLUSTER                --env "$ENV" --body "$(terraform -chdir=terraform/environmental output -raw ecs_cluster)"
          gh variable set ECS_SERVICE                --env "$ENV" --body "$(terraform -chdir=terraform/environmental output -raw ecs_service)"
          gh variable set ECS_TASK_FAMILY            --env "$ENV" --body "$(terraform -chdir=terraform/environmental output -raw ecs_task_family)"
          gh variable set ECS_SG_ID                  --env "$ENV" --body "$(terraform -chdir=terraform/environmental output -raw ecs_sg_id)"
          gh variable set PUBLIC_SUBNET_IDS          --env "$ENV" --body "$(terraform -chdir=terraform/environmental output -raw public_subnet_ids)"
          gh variable set BFF_FUNCTION_PREFIX        --env "$ENV" --body "$(terraform -chdir=terraform/environmental output -raw bff_function_prefix)"
          gh variable set S3_BUCKET                  --env "$ENV" --body "$(terraform -chdir=terraform/environmental output -raw s3_bucket)"
          gh variable set CLOUDFRONT_DISTRIBUTION_ID --env "$ENV" --body "$(terraform -chdir=terraform/environmental output -raw cloudfront_distribution_id)"

  migrations:
    name: Run Alembic Migrations
    needs: [detect-changes, terraform-apply, backend-deploy]
    if: |
      !cancelled() && !failure() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.detect-changes.outputs.backend == 'true')) &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped') &&
      needs.backend-deploy.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: sandbox

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ecs-run-one-off
        with:
          role_arn: ${{ secrets.AWS_ROLE_ARN }}
          cluster: ${{ vars.ECS_CLUSTER }}
          task_definition: ${{ vars.ECS_TASK_FAMILY }}
          subnets: ${{ vars.PUBLIC_SUBNET_IDS }}
          security_group: ${{ vars.ECS_SG_ID }}
          container_overrides: '{"containerOverrides":[{"name":"api","command":["alembic","upgrade","head"]}]}'
          step_label: Migration

  backend-deploy:
    name: Backend Deploy
    needs: [detect-changes, terraform-apply]
    if: |
      !cancelled() && !failure() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.detect-changes.outputs.backend_deploy == 'true')) &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped')
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: sandbox

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and deploy to ECS
        uses: ./.github/actions/ecr-service-deploy
        with:
          role_arn: ${{ secrets.AWS_ROLE_ARN }}
          image_tag: ${{ vars.ECR_REGISTRY }}:${{ github.sha }}
          ecs_cluster: ${{ vars.ECS_CLUSTER }}
          ecs_service: ${{ vars.ECS_SERVICE }}
          ecs_task_family: ${{ vars.ECS_TASK_FAMILY }}

  auth-lambda-deploy:
    name: Auth Lambda Deploy
    needs: [detect-changes, terraform-apply]
    if: |
      !cancelled() && !failure() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.detect-changes.outputs.auth_lambda == 'true')) &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped')
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: sandbox

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          package_json_file: auth-lambda/package.json

      - name: Install dependencies
        working-directory: auth-lambda
        run: pnpm install --frozen-lockfile

      - name: Build handlers
        working-directory: auth-lambda
        run: node esbuild.config.mjs

      - name: Update Lambda function code
        working-directory: auth-lambda
        run: |
          for handler in login callback refresh logout post_confirmation; do
            func_suffix="${handler//_/-}"
            zip -j "/tmp/${handler}.zip" "dist/${handler}.mjs"
            aws lambda update-function-code \
              --function-name "${{ vars.BFF_FUNCTION_PREFIX }}-${func_suffix}" \
              --zip-file "fileb:///tmp/${handler}.zip"
          done

  frontend-deploy:
    name: Frontend Deploy
    needs: [detect-changes, terraform-apply]
    if: |
      !cancelled() && !failure() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.detect-changes.outputs.frontend == 'true')) &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped')
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: sandbox

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          package_json_file: frontend/package.json

      - name: Resolve pnpm store path
        id: pnpm-store
        working-directory: frontend
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: pnpm build

      - name: Sync hashed assets to S3 (immutable, 1-year cache)
        run: |
          aws s3 sync frontend/dist/assets/ s3://${{ vars.S3_BUCKET }}/assets/ \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync root files to S3 (no-cache, delete stale)
        run: |
          aws s3 sync frontend/dist/ s3://${{ vars.S3_BUCKET }}/ \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html" "/"

  compute-destroy:
    name: Compute Destroy
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'DESTROY'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: ${{ inputs.environment || 'sandbox' }}

    steps:
      - name: Verify confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "DESTROY" ]; then
            echo "confirm input must be exactly 'DESTROY' to proceed"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Terraform Setup
        uses: ./.github/actions/tf-setup
        with:
          environment: ${{ inputs.environment || 'sandbox' }}
          aws_region: ${{ env.AWS_REGION }}
          role_arn: ${{ secrets.AWS_ROLE_ARN }}

      - name: Terraform Destroy compute + keepalive
        env:
          ACCOUNT: ${{ inputs.environment || 'sandbox' }}
        run: |
          make environmental-destroy ACCOUNT=${{ env.ACCOUNT }} AWS_PROFILE="" \
            TF_FLAGS="-target=module.compute -target=module.keepalive -auto-approve -no-color"

  documents-seed:
    name: Seed Documents
    needs: [terraform-apply, migrations, backend-deploy]
    if: |
      !cancelled() && !failure() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_seed == true &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped') &&
      (needs.migrations.result == 'success' || needs.migrations.result == 'skipped') &&
      (needs.backend-deploy.result == 'success' || needs.backend-deploy.result == 'skipped')
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: ${{ inputs.environment || 'sandbox' }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ecs-run-one-off
        with:
          role_arn: ${{ secrets.AWS_ROLE_ARN }}
          cluster: ${{ vars.ECS_CLUSTER }}
          task_definition: ${{ vars.ECS_TASK_FAMILY }}
          subnets: ${{ vars.PUBLIC_SUBNET_IDS }}
          security_group: ${{ vars.ECS_SG_ID }}
          container_overrides: '{"containerOverrides":[{"name":"api","command":["python","-m","convfinqa.adapters.persistence.documents_seeder"]}]}'
          step_label: Seeder
