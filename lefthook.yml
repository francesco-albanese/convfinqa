pre-commit:
  parallel: true
  commands:
    biome:
      glob: "frontend/**/*.{ts,tsx,js,jsx,json,jsonc,css}"
      root: "frontend/"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      glob: "frontend/**/*.{ts,tsx}"
      root: "frontend/"
      run: pnpm exec tsc -b
