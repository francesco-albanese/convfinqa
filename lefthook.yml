pre-commit:
  parallel: false
  commands:
    biome:
      glob: "frontend/**/*.{ts,tsx,js,jsx,json,jsonc,css}"
      root: "frontend/"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      glob: "frontend/**/*.{ts,tsx}"
      root: "frontend/"
      run: pnpm exec tsc -b
    build-and-test:
      glob: "frontend/**/*.{ts,tsx,css,json,html}"
      root: "frontend/"
      run: pnpm exec vite build && pnpm test
      stage_fixed: true
    knowledge-memory-index:
      run: command -v bd >/dev/null 2>&1 && bd memories --json > .claude/memory-index.json && git add .claude/memory-index.json || true
    knowledge-lint:
      glob: "{CLAUDE.md,.claude/rules/**/*.md,**/README.md,.claude/memory-index.json}"
      run: python3 scripts/lint_knowledge.py --changed {staged_files}
