services:
  postgres:
    image: postgres:18.3-bookworm
    container_name: convfinqa-postgres
    environment:
      POSTGRES_USER: convfinqa
      POSTGRES_PASSWORD: convfinqa
      POSTGRES_DB: convfinqa
    ports:
      - "5432:5432"
    volumes:
      - convfinqa-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convfinqa -d convfinqa"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  convfinqa-postgres-data:
