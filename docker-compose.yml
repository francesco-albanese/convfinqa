services:
  postgres:
    image: postgres:18.3-bookworm
    container_name: convfinqa-postgres
    environment:
      POSTGRES_USER: convfinqa
      POSTGRES_PASSWORD: convfinqa
      POSTGRES_DB: convfinqa
    ports:
      - "5432:5432"
    volumes:
      - convfinqa-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convfinqa -d convfinqa"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: convfinqa-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - path: .aws.env
        required: false
    environment:
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql+asyncpg://convfinqa:convfinqa@postgres:5432/convfinqa
      LLM_MODEL: ${LLM_MODEL:-bedrock/eu.anthropic.claude-haiku-4-5-20251001-v1:0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-eu-west-2}
      COGNITO_REGION: ${COGNITO_REGION:-eu-west-2}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:?Set COGNITO_USER_POOL_ID}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:?Set COGNITO_CLIENT_ID}
      CONVFINQA_DATASET_PATH: /app/data/convfinqa_dataset.json
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-true}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}}
    volumes:
      - ./data:/app/data:ro

  auth:
    build:
      context: ./auth-lambda
      dockerfile: Dockerfile
    container_name: convfinqa-auth
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      COOKIE_SECURE: "false"
      DATABASE_URL: postgres://convfinqa:convfinqa@postgres:5432/convfinqa
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:?Set COGNITO_CLIENT_ID}
      COGNITO_CLIENT_SECRET: ${COGNITO_CLIENT_SECRET:?Set COGNITO_CLIENT_SECRET}
      COGNITO_HOSTED_UI_BASE_URL: ${COGNITO_HOSTED_UI_BASE_URL:?Set COGNITO_HOSTED_UI_BASE_URL}
      COGNITO_TOKEN_URL: ${COGNITO_TOKEN_URL:?Set COGNITO_TOKEN_URL}
      COGNITO_REVOKE_URL: ${COGNITO_REVOKE_URL:?Set COGNITO_REVOKE_URL}
      CALLBACK_URL: http://localhost:5173/api/auth/callback

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: convfinqa-frontend
    depends_on:
      - app
    ports:
      - "5173:5173"
    environment:
      BACKEND_PROXY_TARGET: http://app:8000
      AUTH_PROXY_TARGET: http://auth:8787

volumes:
  convfinqa-postgres-data:
