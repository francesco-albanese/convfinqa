services:
  postgres:
    image: postgres:18.3-bookworm
    container_name: convfinqa-postgres
    environment:
      POSTGRES_USER: convfinqa
      POSTGRES_PASSWORD: convfinqa
      POSTGRES_DB: convfinqa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - convfinqa-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convfinqa -d convfinqa"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: convfinqa-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql+asyncpg://convfinqa:convfinqa@postgres:5432/convfinqa
      LLM_MODEL: bedrock/eu.anthropic.claude-haiku-4-5-20251001-v1:0
      LLM_MODELS: '["bedrock/eu.anthropic.claude-haiku-4-5-20251001-v1:0"]'
      CONVFINQA_DATASET_PATH: /app/data/convfinqa_dataset.json
      LANGFUSE_ENABLED: "false"
      ENVIRONMENT: local
      AWS_PROFILE: ${AWS_PROFILE:-sandbox-admin}
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      AWS_SDK_LOAD_CONFIG: "1"
      LOCAL_USER_ID: 00000000-0000-4000-8000-000000000001
      LOCAL_USER_EMAIL: local@convfinqa.test
    volumes:
      - ./data:/app/data:ro
      - ${HOME}/.aws:/home/convfinqa/.aws:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 2s
      timeout: 3s
      retries: 30

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: convfinqa-frontend
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      BACKEND_PROXY_TARGET: http://app:8000
      AUTH_PROXY_TARGET: http://app:8000
      VITE_LOCAL_USER_ID: 00000000-0000-4000-8000-000000000001
      VITE_LOCAL_USER_EMAIL: local@convfinqa.test

volumes:
  convfinqa-postgres-data:
