services:
  postgres:
    image: postgres:18.3-bookworm
    container_name: convfinqa-postgres
    environment:
      POSTGRES_USER: convfinqa
      POSTGRES_PASSWORD: convfinqa
      POSTGRES_DB: convfinqa
    ports:
      - "5432:5432"
    volumes:
      - convfinqa-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convfinqa -d convfinqa"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: convfinqa-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - path: .aws.env
        required: false
    environment:
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql+asyncpg://convfinqa:convfinqa@postgres:5432/convfinqa
      LLM_MODEL: ${LLM_MODEL:-bedrock/eu.anthropic.claude-haiku-4-5-20251001-v1:0}
      AWS_REGION: ${AWS_REGION:-eu-west-2}
      CONVFINQA_DATASET_PATH: /app/data/convfinqa_dataset.json
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-true}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}}
    volumes:
      - ./data:/app/data:ro

volumes:
  convfinqa-postgres-data:
