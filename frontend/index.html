<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ConvFinQA</title>
    <script>
      // Mirrors resolveInitialTheme() in src/theme/resolveInitialTheme.ts.
      // Runs before any bundle/CSS to paint <html data-theme> on first frame
      // and avoid a theme flash. Keep in sync with the TS implementation.
      (() => {
        try {
          const v = localStorage.getItem("convfinqa:theme.mode");
          const m = v === "light" || v === "dark" || v === "system" ? v : "system";
          const e =
            m === "system"
              ? matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark"
              : m;
          document.documentElement.setAttribute("data-theme", e);
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
